name: 'Research - baseline game-level D1 factor percentiles'
# Source column verified in hoopR 2026 team-box: team_score.
on:
  push:
    branches: [staging-seven-year-history-2027-roster-identity]
    paths: [.github/workflows/games-factor-percentiles-2026.yml]
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::dplyr
            any::jsonlite
      - run: Rscript scripts/build_game_four_factor_percentiles_2026.R
      - name: Commit research baseline to research branch only
        run: |
          git add research_qa/games/2026_game_factor_percentiles.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'Research: empirical 2025-26 D-I game factor distributions'
          git pull --rebase origin staging-seven-year-history-2027-roster-identity
          git push origin HEAD:staging-seven-year-history-2027-roster-identity
