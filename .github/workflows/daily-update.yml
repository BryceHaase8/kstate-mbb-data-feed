name: Update basketball factual feed

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Optional NCAA ending year override (example: 2026 or 2027)"
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Chicago"

permissions:
  contents: read

concurrency:
  group: basketball-factual-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SEASON: ${{ github.event.inputs.season }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::dplyr
            any::readr
            any::purrr
            any::stringr
            any::tibble
            any::jsonlite

      - name: Build latest D-I factual feed
        run: Rscript scripts/daily_update.R

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
