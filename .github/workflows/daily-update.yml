name: Update basketball factual feed

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Optional NCAA ending year override (example: 2026 or 2027)"
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Chicago"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: basketball-factual-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SEASON: ${{ github.event.inputs.season }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::dplyr
            any::readr
            any::purrr
            any::stringr
            any::tibble
            any::jsonlite

      - name: Build latest D-I factual feed
        run: Rscript scripts/daily_update.R

      - name: Commit refreshed factual data
        run: |
          # Only ESPN player factual data is refreshed each day.
          git add data/current_player_season_stats.csv public/portal_factual_data.json
          if git diff --cached --quiet; then
            echo "No factual-data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily basketball factual data update"

          # Another repository edit could land while this job is running.
          # Rebase onto the latest main before pushing the generated files.
          git pull --rebase origin main
          git push
