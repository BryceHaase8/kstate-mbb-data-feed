name: "V4 research: archive RAPM plus newcomer safety"
on:
  push:
    branches: [v4-research-historical-rapm-coldstart-2026]
    paths: ['.github/workflows/v4-offline-rapm-coldstart.yml', 'scripts/v4_archive_rapm_ablation.py', 'scripts/v4_coldstart_contract.py', 'tests/test_v4_coldstart_1250.py', 'tests/test_v4_archive_identity.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v4-archive-rapm-coldstart
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install model/test dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Static compile and newcomer unit tests (no network)
        run: |
          python -m py_compile scripts/v4_coldstart_contract.py scripts/v4_archive_rapm_ablation.py
          python tests/test_v4_coldstart_1250.py
          python tests/test_v4_archive_identity.py
      - name: Fetch FROZEN HISTORICAL RAPM files for QA only
        run: |
          mkdir -p .historical_only_archive
          for yr in 2023 2024 2025; do
            curl --fail --location --silent --show-error --retry 2 --max-time 75 \
              "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/ncaa_mbb_rapm/ncaa_mbb_rapm_${yr}.csv.gz" \
              -o ".historical_only_archive/ncaa_mbb_rapm_${yr}.csv.gz"
            gzip -t ".historical_only_archive/ncaa_mbb_rapm_${yr}.csv.gz"
          done
      - name: Inspect crosswalk field examples (diagnostic, archived research only)
        run: |
          python - <<'PY'
          import pandas as pd
          a=pd.read_csv('.historical_only_archive/ncaa_mbb_rapm_2025.csv.gz')
          b=pd.read_csv('data/current_player_season_stats.csv',low_memory=False)
          b=b[b.season==2025]
          print('ARCHIVE RAPM COLUMNS',a.columns.tolist())
          print('ARCHIVE RAPM SAMPLE',a[['player','team','estimand']].head(10).to_dict('records'))
          print('ESPN SAMPLE',b[['player_name','team_name']].head(10).to_dict('records'))
          PY
      - name: Strict out-of-time 2025 to 2026 RAPM incremental comparison
        run: |
          python scripts/v4_archive_rapm_ablation.py --input-dir .historical_only_archive
      - name: Commit ONLY aggregated research result, no external source data
        run: |
          git add research_qa/v4_archive_rapm_predictiveness.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V4 research: historical RAPM incremental validation summary'
          git pull --rebase origin v4-research-historical-rapm-coldstart-2026
          git push origin HEAD:v4-research-historical-rapm-coldstart-2026
      - name: Explicitly remove historical external files
        if: always()
        run: rm -rf .historical_only_archive
