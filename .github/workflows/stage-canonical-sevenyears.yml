name: Staging QA — canonical seven years, unchanged public feed
on:
  push:
    branches:
      - staging-seven-year-history-2027-roster-identity
    paths:
      - ".github/workflows/stage-canonical-sevenyears.yml"
      - "scripts/stage_production_history_2020_2026.R"
permissions:
  contents: write
concurrency:
  group: stage-seven-year-canonical
  cancel-in-progress: false
jobs:
  stage-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::readr
            any::dplyr
            any::jsonlite
      - name: Generate seven-year canonical CSV and identical-scope public JSON
        run: Rscript scripts/stage_production_history_2020_2026.R
      - name: Save QA result and staging candidate files only on research branch
        if: success()
        run: |
          git add data/current_player_season_stats.csv public/portal_factual_data.json research_qa/roster_integration/seven_year_prod_candidate_qa.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage full historical canonical CSV; preserve unchanged four-year public feed scope"
          git pull --rebase origin staging-seven-year-history-2027-roster-identity
          git push origin HEAD:staging-seven-year-history-2027-roster-identity
