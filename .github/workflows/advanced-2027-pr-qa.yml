name: ESPN 2027 advanced PBP integration checks
on:
  workflow_dispatch:
  push:
    branches: [research-2027-shot-onoff-position-automation]
  pull_request:
    paths:
      - "scripts/build_2027_advanced.py"
      - "scripts/collect_2027_advanced.R"
      - "scripts/daily_update.R"
      - ".github/workflows/daily-update.yml"
      - "tests/test_build_2027_advanced.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate synthetic ESPN shots, box minutes and 5-man intervals
        run: |
          python -m py_compile scripts/build_2027_advanced.py
          python -m unittest discover -s tests -p 'test_build_2027_advanced.py' -v
          python scripts/build_2027_advanced.py
      - name: Verify season-appropriate advanced data presence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[Path(f'public/portal_{k}_2027/manifest.json') for k in ('shots','onoff','positions')]
          present=[p.exists() for p in paths]
          assert len(set(present))==1,'Missing a related advanced 2027 manifest'
          if not present[0]:
              print('Preseason: all advanced manifests correctly withheld')
          else:
              records=[json.loads(p.read_text()) for p in paths]
              assert all(d['schemaVersion']==1 and d['season']==2027 for d in records)
              # build_2027_advanced.py uses a legacy provisional manifest
              # with shot.metrics and role intervals, not gamesVerified
              # on every file. Production publisher supplies richer fields.
              shots,onoff,positions=records
              source=shots.get('gamesInSource',shots.get('metrics',{}).get('gamesInSource',0))
              shot_games=shots.get('gamesVerified',shots.get('metrics',{}).get('eligibleShotTeamGames',0))
              onoff_games=onoff.get('gamesVerified',0)
              assert source>=0 and 0<=shot_games<=max(source*2,source)
              assert onoff_games>=0 and onoff_games<=max(source,1)
              assert positions.get('playersWithRoleTime',0)>=0
              if 'gamesInSource' in positions:
                  assert positions['gamesVerified']<=positions['gamesInSource']
              else:
                  assert positions.get('verifiedFivePlayerIntervals',0)>=0
              print('2027 advanced data present with valid source and verification counts',source,shot_games,onoff_games)
          PY

  espn-schema-probe:
    # R cold installs cost Actions minutes; run only on explicit manual verification.
    # Verify real archived ESPN PBP once before opening week; keep the existing synthetic QA.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::dplyr
            any::jsonlite
      - name: Parse advanced collector and inspect archived ESPN game
        shell: bash
        run: |
          Rscript - <<'RS'
          parse(file='scripts/collect_2027_advanced.R')
          p <- hoopR::espn_mbb_pbp(game_id=401856563)
          if(is.null(p) || !is.data.frame(p) || nrow(p)<50L)
            stop('ESPN historical per-game PBP probe unavailable')
          essential <- c('period_number','clock_display_value','type_text','team_id')
          if(!all(essential %in% names(p)))stop('ESPN PBP schema changed: ',paste(setdiff(essential,names(p)),collapse=','))
          person <- intersect(c('athlete_id_1','participants_0_athlete_id'),names(p))
          if(!length(person))stop('ESPN primary athlete identifier missing')
          message('PASS live hoopR ESPN schema for ',nrow(p),' archived plays')
          RS
