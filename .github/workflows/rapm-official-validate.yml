name: Research RAPM independent full-season validation
on:
  push:
    branches: [rapm-fullseason-2026-validation]
    paths: [.github/workflows/rapm-official-validate.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rapm-2026-independent-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_SEASON: "2026"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::dplyr
            any::readr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Reconstruct season data from hoopR with official ESPN game box
        run: Rscript scripts/rapm_ingest.R
      - name: Audit all lineup minutes against official game box
        run: python scripts/rapm_official_minute_audit.py
      - name: Commit isolated QA outputs only
        run: |
          git add research_qa/rapm_fullseason_official_lineup_summary.json research_qa/rapm_fullseason_official_lineup_games.csv
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Research only: independent full-season lineup QA'
          git push
