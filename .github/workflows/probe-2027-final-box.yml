name: Probe 2027 ESPN final boxes (read-only)
on:
  push:
    branches: [fix-2027-live-box-ingestion-2026-11-02]
    paths: [".github/workflows/probe-2027-final-box.yml", "scripts/daily_update.R", "scripts/season_2027_box_fallback.R", ".github/workflows/daily-update.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Inspect actual ESPN November 1 games
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base="https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball"
          for p in ("/scoreboard?dates=20261101&groups=50&limit=500","/summary?event=401920982"):
              with urllib.request.urlopen(urllib.request.Request(base+p,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"}),timeout=25) as f: doc=json.load(f)
              if "/scoreboard" in p:
                  for e in doc.get("events",[]): 
                      c=(e.get("competitions") or [{}])[0]
                      print("scoreboard",e.get("id"),e.get("date"),(e.get("season") or {}),c.get("status"),[(t["team"].get("id"),t.get("score"),t.get("winner")) for t in c.get("competitors",[])])
              else:
                  c=(doc.get("header") or {}).get("competitions",[{}])[0]
                  print("summary",doc.get("header",{}).get("season"), c.get("status"),c.get("date"),len(doc.get("boxscore",{}).get("players",[])))
                  for side in doc.get("boxscore",{}).get("players",[]):
                      stat=(side.get("statistics") or [{}])[0]
                      print("team",side.get("team",{}).get("id"),"stat keys",stat.get("keys"),"first athlete",[(a.get("athlete",{}).get("id"),a.get("stats")) for a in stat.get("athletes",[])[:2]])
          PY
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install hoopR
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::jsonlite
            any::dplyr
            any::readr
            any::purrr
            any::stringr
            any::tibble
      - name: Verify direct hoopR 2027 box and Division-I membership
        run: |
          Rscript - <<'RS'
          suppressPackageStartupMessages(library(hoopR))
          x <- hoopR::espn_mbb_player_box(game_id=401920982)
          cat("GAME BOX COUNT:",nrow(x),"\n")
          cat("BOX COLS:",paste(names(x),collapse=","),"\n")
          print(utils::head(x[c("athlete_id","athlete_display_name","game_id","season","team_id","points","minutes")],3))
          stopifnot(nrow(x)>=20,all(as.integer(x$season)==2027),length(unique(x$team_id))==2)
          children<-hoopR::espn_mbb_season_group_children(group_id=50,season=2027,season_type=2)
          cat("D1 CONFERENCE GROUPS:",nrow(children),"\n")
          stopifnot(nrow(children)>15)
          RS
      - name: Build 2027 full factual stats from per-game ESPN boxes
        env:
          TARGET_SEASON: "2027"
        run: Rscript scripts/daily_update.R
      - name: Validate historical immutability and published season counts
        run: python3 scripts/validate_factual_feed.py
      - name: Verify Notre Dame and Villanova season statistics and game logs
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open("public/portal_factual_qa.json"))
          assert q["currentDataSeason"]==2027,q
          assert q["seasonPlayerCounts"].get("2027",0)>=20,q
          d=json.load(open("public/portal_factual_data.json"))
          for pid in ("5312256","4895776"):
              p=d["players"].get(pid)
              assert p and any(s["season"]==2027 and s["gp"]>=1 for s in p["seasons"]),(pid,p)
          m=json.load(open("public/portal_game_logs_2027/manifest.json"))
          assert m["season"]==2027 and m["gamesVerified"]>=2 and m["playerGameRows"]>=20,m
          print("2027 SEASON RELEASE QA PASS",q["seasonPlayerCounts"],m)
          PY
