name: Research only — ESPN 2026-27 roster readiness
on:
  workflow_dispatch:
  push:
    branches:
      - research-2027-espn-roster-reaudit-20261018
    paths:
      - ".github/workflows/roster-2027-research-audit.yml"
      - "scripts/research_roster_2027_reaudit.R"
permissions:
  contents: write
concurrency:
  group: roster-2027-research-reaudit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::dplyr
            any::purrr
            any::readr
            any::tibble
            any::jsonlite
      - name: Compare all D-I 2026 vs 2027 ESPN season rosters
        run: Rscript scripts/research_roster_2027_reaudit.R
      - name: Commit research-only audit summaries
        run: |
          git add research_qa/espn_roster_2027/
          if git diff --cached --quiet; then
            echo "No roster changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Research: October 18 ESPN 2027 roster readiness re-audit"
          git pull --rebase origin research-2027-espn-roster-reaudit-20261018
          git push origin HEAD:research-2027-espn-roster-reaudit-20261018
