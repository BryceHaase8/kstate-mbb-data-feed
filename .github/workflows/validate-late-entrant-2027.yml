name: Validate dated 2027 NIL entrant without publishing
on:
  push:
    branches: [nil-late-entrants-20271030]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIL_MODEL_KEY: ${{ secrets.NIL_MODEL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m py_compile scripts/nil_model/nil_season_engine.py scripts/nil_model/publish_guard.py scripts/nil_model/record_stock_history.py
      - run: bash -n scripts/nil_model/refresh_nil.sh
      - run: python3 -m venv "$RUNNER_TEMP/nil-venv"
      - name: Validate full 2027 NIL pipeline from frozen inputs
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/nil-venv/bin/activate"
          pip install -q -r scripts/nil_model/requirements-nil.txt
          test -n "$NIL_MODEL_KEY"
          bash scripts/nil_model/refresh_nil.sh
          python3 - <<'PY'
          import json
          data=json.load(open('public/nil_estimation_model_2027.json'))
          row=data['byESPNId']['5468197']
          assert row['preseason']==25000 and row['value']==25000 and row['anchorType']=='LATE_ENTRANT_BASELINE_2027',row
          assert data['playerCount']==len(data['byESPNId'])
          anchor=json.load(open('public/stock_watch/preseason_2027.json'))
          assert '5468197' not in anchor['byESPNId'] and len(anchor['byESPNId'])==6057
          assert not json.load(open('public/stock_watch/manifest_2027.json'))['dates']
          print('PASS: Canisius late entrant $25k, baseline preserved, no fictitious Stock Watch snapshot')
          PY
