name: Read-only ESPN 2026-27 roster audit
on:
  push:
    branches: [roster-audit-20261030]
    paths:
      - 'scripts/roster_audit_2027.py'
      - '.github/workflows/roster-audit-2027.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check all ESPN D-I rosters against staged snapshot
        run: python3 scripts/roster_audit_2027.py
      - name: Save read-only comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-roster-audit-20261030
          path: roster_audit_20261030.json
          if-no-files-found: warn
