name: 'Research: 2025 RAPM forecast to 2026'
on:
  push:
    branches: [impact-v3-nextseason-2025-rapm-validation]
    paths: ['.github/workflows/impact-v3-prior-season-rapm.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: impact-v3-prior-season-rapm
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_SEASON: '2025'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::dplyr
            any::readr
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install model libraries
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Preflight checks
        run: |
          python -m py_compile scripts/rapm_2025_luck_backtest.py scripts/impact_v3_2025_to_2026_rapm_check.py
          python tests/test_rapm_v2_luck.py
      - name: Ingest 2024-25 season PBP and official player minutes
        run: Rscript scripts/rapm_ingest.R
      - name: Compute 2024-25 minute-verified luck RAPM (no team strength subtraction)
        run: python scripts/rapm_2025_luck_backtest.py --season 2025
      - name: Compare 2025 box-alone vs box+RAPM on unseen 2026 outcomes
        run: python scripts/impact_v3_2025_to_2026_rapm_check.py
      - name: Commit research-only artifacts
        run: |
          git add research_qa/rapm_2025_luck_model.json research_qa/rapm_2025_luck_audit.json research_qa/impact_v3_2025_to_2026_rapm_incremental.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '2025 RAPM retrospective and 2026 held-out research QA'
          git pull --rebase origin impact-v3-nextseason-2025-rapm-validation
          git push origin HEAD:impact-v3-nextseason-2025-rapm-validation
