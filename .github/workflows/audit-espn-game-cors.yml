name: 'Research - audit ESPN game scoreboard browser CORS'
on:
  push:
    branches: [staging-seven-year-history-2027-roster-identity]
    paths: [.github/workflows/audit-espn-game-cors.yml]
permissions:
  contents: write
jobs:
  cors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify real ESPN 2026-02-06 schedules and browser CORS
        run: python3 scripts/audit_espn_game_browser_cors.py
      - name: Publish factual QA to research branch
        run: |
          git add research_qa/espn_game_browser_cors_20261022.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'Research: verify scoreboard 2026-02-06 CORS'
          git pull --rebase origin staging-seven-year-history-2027-roster-identity
          git push origin HEAD:staging-seven-year-history-2027-roster-identity
