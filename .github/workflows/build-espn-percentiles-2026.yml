name: Research - ESPN native 2026 positional percentiles
on:
  push:
    branches: [portal-v722-espn-player-percentiles-research]
    paths:
      - "scripts/build_espn_percentiles_2026.py"
      - ".github/workflows/build-espn-percentiles-2026.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Build ESPN player percentiles from own archive
        run: python scripts/build_espn_percentiles_2026.py
      - name: Audit all peer cohorts, metric arrays and IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_data/staged/portal_percentiles_2026/overview_2026.json')
          j=json.loads(p.read_text())
          assert j['schemaVersion']==2 and j['season']==2026
          assert j['hasFullNationalCoverage'] and len(j['byESPNId'])>=4900
          assert 'dgbpm' not in j['metricNames']
          assert 'Bart Torvik' not in j['source']
          assert len(j['metricNames'])==27
          for pos,by_metric in j['peers'].items():
              assert int(pos) in range(1,6) and j['peerCounts'][pos]>50
              for key,values in by_metric.items():
                  assert values==sorted(values)
          for player in j['byESPNId'].values():
              assert len(player)==12 and len(player[5])==27
          print('PASS',len(j['byESPNId']),'ESPN IDs; all peer distributions monotone')
          PY
      - name: Publish research assets only
        run: |
          git add research_data/staged/portal_percentiles_2026
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Research: full 2025-26 ESPN-native position percentiles"
          git pull --rebase origin portal-v722-espn-player-percentiles-research
          git push origin HEAD:portal-v722-espn-player-percentiles-research
