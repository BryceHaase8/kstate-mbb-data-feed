name: Daily research RAPM (isolated feed)
on:
  workflow_dispatch:
    inputs:
      season:
        description: Optional NCAA ending year (e.g. 2027)
        required: false
        type: string
  schedule:
    - cron: '47 7 * * *'
      timezone: America/Chicago
  push:
    branches:
      - rapm-inseason-prototype-2026
    paths:
      - 'scripts/rapm_*'
      - '.github/workflows/rapm-daily.yml'
permissions:
  contents: write
concurrency:
  group: research-rapm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_SEASON: ${{ inputs.season }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::dplyr
            any::readr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated RAPM dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Pull season-to-date ESPN play-by-play and official player box
        run: Rscript scripts/rapm_ingest.R
      - name: Rebuild research RAPM from cumulative current-season games
        run: |
          OPENBLAS_NUM_THREADS=1 python scripts/rapm_daily.py
      - name: Commit research feed only
        run: |
          git add public/rapm_research.json public/rapm_research_audit.json 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No safe RAPM update'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Experimental RAPM research refresh'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
