name: '2026 Impact V3 — research-only BPM plus luck RAPM'
on:
  push:
    branches: [impact-v3-bpm-luck-rapm-2026-research]
    paths: ['.github/workflows/impact-v3-research.yml', 'scripts/impact_v3_research.py', 'research_qa/ebpm_v3_coefficients.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: impact-v3-2026-research
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install model runtime
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Compile and test
        run: |
          python -m py_compile scripts/impact_v3_research.py
          python tests/test_impact_v3_research.py
      - name: Generate 2025-26 impact V3 national rankings
        run: python scripts/impact_v3_research.py --season 2026
      - name: Commit research outputs (no production feed)
        run: |
          git add research_qa/impact_v3_all_2026.csv research_qa/impact_v3_top_100_2026.csv research_qa/impact_v3_audit_2026.json
          if git diff --cached --quiet; then echo 'No changed V3 outputs'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Research only: V3 impact rankings and QA'
          git pull --rebase origin impact-v3-bpm-luck-rapm-2026-research
          git push origin HEAD:impact-v3-bpm-luck-rapm-2026-research
