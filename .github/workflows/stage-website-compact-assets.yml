name: Research-stage compact ESPN roster and 2026 Impact V3
on:
  push:
    branches:
      - staging-seven-year-history-2027-roster-identity
    paths:
      - ".github/workflows/stage-website-compact-assets.yml"
      - "scripts/stage_website_compact_assets.py"
permissions:
  contents: write
jobs:
  stage-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Convert validated research files to compact factual browser assets
        run: python scripts/stage_website_compact_assets.py
      - name: Commit compact public research data on staging branch only
        run: |
          git add research_data/staged/roster_2027_site_compact.json research_data/staged/roster_2027_zero_fallback.json research_data/staged/impact_v3_2026_site.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Research staging: lighter roster, 0 eligibility subset, and V3 Impact scores"
          git pull --rebase origin staging-seven-year-history-2027-roster-identity
          git push origin HEAD:staging-seven-year-history-2027-roster-identity
