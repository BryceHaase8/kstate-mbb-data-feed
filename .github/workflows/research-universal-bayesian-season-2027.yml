name: Universal 2027 NIL Bayesian updater shadow tests
on:
  push:
    branches:
      - season-2027-universal-bayesian-cold-start
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NIL_MODEL_KEY: ${{ secrets.NIL_MODEL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production model dependencies
        run: python -m pip install -r scripts/nil_model/requirements-nil.txt
      - name: Source syntax and all baseline/in-season unit tests
        run: |
          python -m compileall -q scripts/nil_model tests
          python -m unittest discover -s tests -p 'test_v4_*.py' -v
          python -m unittest discover -s tests -p 'test_international_*.py' -v
          python -m unittest discover -s tests -p 'test_universal_season_2027.py' -v
      - name: Check published preseason data, 6057 frozen anchors, rollback guards
        run: |
          set -euo pipefail
          test -n "$NIL_MODEL_KEY"
          bash scripts/nil_model/refresh_nil.sh
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          old=json.loads((root/'public/stock_watch/preseason_2027.json').read_text())
          n=json.loads((root/'public/nil_estimation_model_2027.json').read_text())
          m=json.loads((root/'public/stock_watch/manifest_2027.json').read_text())
          a=n['byESPNId']
          assert len(old['byESPNId'])==6057 and len(a)>=12000
          approved=json.loads((root/'public/stock_watch/opening_price_corrections_2027.json').read_text())['byESPNId']
          assert set(approved)=={'5455519','5454820'} and old['byESPNId']['5455519']==155000 and old['byESPNId']['5454820']==58200
          assert approved['5454820']['sourceBaseline']==58200 and approved['5454820']['value']==1500000
          assert approved['5455519']['sourceBaseline']==155000 and approved['5455519']['value']==2500000
          effective={**old['byESPNId'],**{k:v['value'] for k,v in approved.items()}}
          mismatch=[(k,v,a[k].get('preseason'),a[k].get('games'),a[k].get('status'))
                    for k,v in effective.items() if a[k]['preseason']!=v]
          if mismatch: print('FROZEN_ANCHOR_MISMATCHES',len(mismatch),mismatch[:15],flush=True)
          assert not mismatch,'Frozen opening prices were changed by 2027 updater'
          assert all(a[k]['status']=='PRESEASON_BASELINE' and a[k]['weight']==0 and a[k]['value']==v
                     for k,v in effective.items() if not a[k].get('games'))
          assert a['5455519']['anchorType']=='INTERNATIONAL_PRO_PRESEASON_STAFF_REVIEWED'
          factual=json.loads((root/'public/portal_factual_qa.json').read_text())
          if factual['currentDataSeason']==2026:
              assert not m['dates'] and not m['months']
          else:
              assert factual['currentDataSeason']==2027
              assert m['dates'] and all('2026-11-01'<=d<='2027-05-31' for d in m['dates'])
          print('PASS: 6057 frozen original anchors unchanged; real-game NIL updates and Stock Watch valid')
          PY
          sha256sum public/stock_watch/manifest_2027.json > "$RUNNER_TEMP/nil-stock-manifest.sha"
      - name: Real encrypted model, synthetic 1/10/30-game season scenarios
        run: |
          set -euo pipefail
          trap 'rm -f scripts/nil_model/nil_estimation_model_core_shadow.joblib' EXIT
          python scripts/nil_model/decrypt_model.py
          python scripts/nil_model/qa_universal_synthetic_2027.py "$RUNNER_TEMP/nil_candidate/team_2027.json"
      - name: Confirm synthetic runs do not modify real Stock Watch history
        run: |
          sha256sum -c "$RUNNER_TEMP/nil-stock-manifest.sha"
          echo 'PASS: synthetic simulations did not modify real dated Stock Watch history'
