name: RAPM 2025-26 full-season official box audit
on:
  push:
    branches: [rapm-fullseason-2026-validation]
    paths: [.github/workflows/rapm-2026-official-box.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  box:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::hoopR
            any::dplyr
            any::readr
      - name: Export full 2025-26 official ESPN player game box
        run: Rscript scripts/rapm_official_full_box_2026.R
      - name: Commit isolated compressed research dataset
        run: |
          git add research_qa/espn_player_box_2026.csv.gz
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Research only: 2026 official box audit data"
          git push
