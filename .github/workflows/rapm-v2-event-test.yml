name: Research RAPM V2 shot-event unit test
on:
  push:
    branches: [rapm-v2-torvik-luck-2026-research]
    paths: [.github/workflows/rapm-v2-event-test.yml]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python tests/test_rapm_v2_luck.py
