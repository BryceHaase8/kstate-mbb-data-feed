name: Research - ON/OFF national validation
on:
  push:
    branches: [portal-v717-onoff-research-2026]
    paths:
      - "scripts/qa_portal_onoff_2026.py"
      - ".github/workflows/qa-onoff-2026.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Audit all 128 actual player splits and arithmetic
        run: python scripts/qa_portal_onoff_2026.py
