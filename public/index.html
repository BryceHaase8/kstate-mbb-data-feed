<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>College Basketball Factual Data Feed</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:48px auto;padding:0 20px;color:#171717}
    .card{border:1px solid #ddd;border-radius:12px;padding:22px}
    code{background:#f4f4f4;padding:2px 6px;border-radius:5px}
    a{color:inherit}
  </style>
</head>
<body>
  <h1>College Basketball Factual Data Feed</h1>
  <div class="card">
    <p>This endpoint contains public NCAA Division I men's basketball factual data only.</p>
    <p id="status">Loading feed metadata…</p>
    <p><a href="./portal_factual_data.json">Open portal_factual_data.json</a></p>
  </div>
  <script>
    fetch("./portal_factual_data.json", {cache:"no-store"})
      .then(r => r.json())
      .then(d => {
        document.getElementById("status").textContent =
          `Season ${d.seasonLabel || d.season} • ${Number(d.playerCount || 0).toLocaleString()} players • generated ${d.generatedAt}`;
      })
      .catch(() => {
        document.getElementById("status").textContent = "Feed metadata could not be loaded.";
      });
  </script>
</body>
</html>
